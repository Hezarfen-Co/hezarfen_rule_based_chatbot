# Çelebi QUIC köprüsü — bu compose yalnızca TEK chatbot container'ı oluşturur.
# Backend compose ayakta olmalı; bu servis backend'in ağına katılır ve oradan
# QUIC/UDP ile `hezarfen_backend:8090` adresine dial-in eder. Host portu veya
# demo web arayüzü AÇMAZ (web.py yalnız geliştirici aracıdır).
#
# Varsayılanların TEK kaynağı Containerfile'ın ENV bloğudur; bu dosya hiçbir
# `environment:` girdisi taşımaz, böylece hiçbir şey operatörün dosyasını
# gölgeleyemez. Sunucuda ~/hezarfen_rule_based_chatbot/hezarfen_rule_based_chatbot.env ile ezilir.
#
#   podman compose up -d --build
#
# Ön koşul: backend'de AI köprüsü AÇIK olmalı — hezarfen_backend.env içinde
# AI_QUIC_ADDR=0.0.0.0:8090 (127.0.0.1 DEĞİL: konteyner kendi loopback'ine
# bağlanırsa dışarıdan hiçbir servis ulaşamaz) ve AI_SHARED_TOKEN buradaki
# token ile AYNI olmalı.
services:
  chatbot:
    build:
      context: .
      dockerfile: Containerfile
    # HEZARFEN_TAG deploy tarafından yazılan stack.env'den gelir (--env-file).
    image: localhost/hezarfen_rule_based_chatbot:${HEZARFEN_TAG:-latest}
    container_name: hezarfen_rule_based_chatbot
    init: true
    env_file:
      # Sunucuda elle yazılır (0600); laptopta yoktur.
      - path: hezarfen_rule_based_chatbot.env
        required: false
    restart: unless-stopped
    networks:
      - backend_net

# Ürün modunda backend'in ağına dışarıdan bağlanılır (backend compose bu ağı yaratır).
networks:
  backend_net:
    external: true
    name: hezarfen_backend_default
