# Çelebi ürün köprüsü — bu compose yalnızca TEK chatbot container'ı oluşturur.
# Önce backend compose ayakta olmalı; backend ağına bağlanıp QUIC/UDP ile
# hezarfen-backend:8090 adresine dial-in eder. Host portu veya demo web UI açmaz.
#
#   podman compose up -d --build
services:
  bridge:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/rule-based-chatbot:local
    container_name: hezarfen-chatbot-bridge
    init: true
    command: ["python", "-m", "src.bridge"]
    environment:
      AI_BRIDGE_HOST: hezarfen-backend      # backend container'ının adı
      # aioquic bu hedefe UDP ile bağlanır; burada TCP port yayını yoktur.
      AI_BRIDGE_PORT: "8090"
      AI_BACKEND_URL: http://hezarfen-backend:8080
      AI_SHARED_TOKEN: change-me            # backend ile AYNI olmalı
      AI_TLS_SERVER_NAME: localhost         # self-signed sertifikanın SAN'ı
      AI_SERVICE_NAME: celebi
      HEZARFEN_ASSISTANT_ROLE: ogrenci
    restart: unless-stopped
    networks:
      - backend_net

# Ürün modunda backend'in ağına dışarıdan bağlanılır (backend compose bu ağı yaratır).
networks:
  backend_net:
    external: true
    name: hezarfen_backend_default
